[project]
name = "nepsevol"
version = "0.1.0"
description = "Volatility estimation in a market without derivatives: evidence from NEPSE"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
